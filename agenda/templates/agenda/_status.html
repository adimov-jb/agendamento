<span class="inline-block rounded-full px-2 py-0.5 text-xs font-medium
  {% if status == 'agendado' %}bg-sky-100 text-sky-800
  {% elif status == 'atendido' %}bg-emerald-100 text-emerald-800
  {% elif status == 'faltou' %}bg-red-100 text-red-800
  {% elif status == 'precisa_reagendar' %}bg-amber-100 text-amber-800
  {% else %}bg-slate-100 text-slate-600{% endif %}">{{ rotulo }}</span>
