{% extends "base.html" %}

{% block title %}Recuperar senha · {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-2xl font-bold">Recuperar senha</h1>
  <p class="mt-1 text-slate-600">Informe o seu e-mail. Enviaremos um link para você criar uma nova senha.</p>

  <form method="post" class="cartao mt-6 space-y-5 p-5 sm:p-6">
    {% csrf_token %}
    <div>
      <label for="id_email" class="block text-sm font-medium text-slate-700">E-mail</label>
      <input type="email" name="email" id="id_email" autocomplete="email" autofocus required maxlength="254"
             class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-rose-500 focus:ring-rose-500">
      {% for erro in form.email.errors %}<p class="mt-1 text-sm text-red-600">{{ erro }}</p>{% endfor %}
    </div>
    <button type="submit" class="btn-primario w-full">Enviar link</button>
  </form>
</div>
{% endblock %}
