{% extends "base.html" %}

{% block title %}Recuperar senha · {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-2xl font-bold">Verifique seu e-mail</h1>
  <p class="mt-2 text-slate-600">Se o e-mail informado tiver login no sistema, você vai receber em instantes um link para criar uma nova senha.</p>
  <a href="{% url 'login' %}" class="btn-secundario mt-6 w-full">Voltar para o login</a>
</div>
{% endblock %}
