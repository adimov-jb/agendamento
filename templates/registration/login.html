{% extends "base.html" %}

{% block title %}Entrar · {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-2xl font-bold">Área da equipe</h1>
  <p class="mt-1 text-slate-600">Entre com seu e-mail e senha.</p>

  <form method="post" class="cartao mt-6 space-y-5 p-5 sm:p-6">
    {% csrf_token %}
    {% if form.errors %}<p class="text-sm text-red-600">E-mail ou senha incorretos.</p>{% endif %}
    <div>
      <label for="id_username" class="block text-sm font-medium text-slate-700">E-mail</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autofocus required
             value="{{ form.username.value|default:'' }}"
             class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-rose-500 focus:ring-rose-500">
    </div>
    <div>
      <label for="id_password" class="block text-sm font-medium text-slate-700">Senha</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required
             class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-rose-500 focus:ring-rose-500">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-primario w-full">Entrar</button>
  </form>
</div>
{% endblock %}
